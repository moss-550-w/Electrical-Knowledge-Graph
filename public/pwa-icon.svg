<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#5cb3ff"/>
      <stop offset="0.55" stop-color="#409EFF"/>
      <stop offset="1" stop-color="#E6A817"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#409EFF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#409EFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- 全幅背景：兼容 maskable 圆/方裁切，无透明缺口 -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="256" cy="262" r="190" fill="url(#glow)"/>
  <!-- 闪电主体落在中心安全区（~80%） -->
  <path d="M300 100 L160 290 L250 290 L212 420 L360 230 L272 230 Z"
        fill="url(#bolt)" stroke="#cfe8ff" stroke-width="6" stroke-linejoin="round"/>
</svg>
